services:
  backend:
    build: ../svaha-uni-api
    environment:
      HTTP_ADDR: ':8081'
      CORS_ORIGINS: 'http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:4174,http://localhost:4174'
      DATABASE_PATH: '/data/chat.db'
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - chat-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
  frontend:
    build: .
    ports:
      - '127.0.0.1:4173:8080'
    depends_on: [backend]
    restart: unless-stopped

volumes:
  chat-data:
